name: rollback-supabase

# Возврат сайта на Supabase после cutover-spaceweb. Домен и сам сайт остаются на хостинге SpaceWeb,
# данные, вход, фото и задания по расписанию — снова в Supabase. По шагам:
#   1. в Supabase снова включаются задания по расписанию (push, итоги конкурсов, новости);
#   2. отчёт: что успело измениться в базе SpaceWeb после переключения (эти изменения не переносятся);
#   3. снимается отметка api.live — планировщик на SpaceWeb засыпает, выкладка собирает сайт с Supabase;
#   4. выкладка сайта (deploy-spaceweb).
# Запуск: Actions → rollback-supabase → Run workflow, в поле подтверждения — ВЕРНУТЬ.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Чтобы вернуть сайт на Supabase, напишите: ВЕРНУТЬ"
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: db-spaceweb
  cancel-in-progress: false

jobs:
  rollback:
    if: inputs.confirm == 'ВЕРНУТЬ'
    runs-on: ubuntu-latest
    env:
      PG_BIN: /usr/lib/postgresql/17/bin
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGPASSWORD: ${{ secrets.SPACEWEB_DB_PASSWORD }}
      DST_URL: host=${{ vars.SPACEWEB_DB_HOST || 'pg4.sweb.ru' }} port=${{ vars.SPACEWEB_DB_PORT || '5433' }} dbname=${{ vars.SPACEWEB_DB_NAME || 'kutygama_podokon' }} user=${{ vars.SPACEWEB_DB_USER || 'kutygama_podokon' }} connect_timeout=15 application_name=podokonnik-rls-bypass
    steps:
      - uses: actions/checkout@v4
      - name: Клиент PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Подключение к Supabase
        run: echo "SRC_URL=$(bash spaceweb/db/find-source.sh)" >> "$GITHUB_ENV"
      - name: 1. Включить задания Supabase
        run: |
          $PG_BIN/psql "$SRC_URL" -X -v ON_ERROR_STOP=1 -At \
            -c "select 'включено: ' || j.jobname from (select jobid, jobname from cron.job where not active) j, lateral cron.alter_job(j.jobid, active := true)"
      - name: 2. Что изменилось на SpaceWeb после переключения
        run: |
          changed=0
          for t in $($PG_BIN/psql "$DST_URL" -XAtc "select tablename from pg_tables where schemaname = 'public' order by 1"); do
            a=$($PG_BIN/psql "$DST_URL" -XAtc "select count(*) from public.\"$t\"")
            b=$($PG_BIN/psql "$SRC_URL" -XAtc "select count(*) from public.\"$t\"" 2>/dev/null || echo "?")
            [ "$a" = "$b" ] || { echo "$t: SpaceWeb $a, Supabase $b"; changed=1; }
          done
          for t in auth.users storage.objects; do
            a=$($PG_BIN/psql "$DST_URL" -XAtc "select count(*) from $t")
            b=$($PG_BIN/psql "$SRC_URL" -XAtc "select count(*) from $t")
            [ "$a" = "$b" ] || { echo "$t: SpaceWeb $a, Supabase $b"; changed=1; }
          done
          [ "$changed" = 0 ] && echo "Число записей совпадает — после переключения ничего не добавлялось и не удалялось"
      - name: 3. Снять отметку api.live
        run: |
          $PG_BIN/psql "$DST_URL" -X -v ON_ERROR_STOP=1 -q -c "drop table if exists api.live"
          echo "Отметка снята — сайт будет собран с Supabase, планировщик на SpaceWeb не работает"
      - name: 4. Выложить сайт с Supabase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-spaceweb.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Выкладка запущена: Actions → deploy-spaceweb"
