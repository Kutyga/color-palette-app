name: hosting-probe

# Разовая проверка хостинга SpaceWeb перед переездом базы: версии языков и PostgreSQL,
# доступ к базе с хостинга, выход в интернет. Только читает, ничего не меняет.
on:
  push:
    branches: [claude/relaxed-euler-8qpsqr]
    paths: [".github/workflows/hosting-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: vars.SPACEWEB_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: База SpaceWeb
        env:
          SSH_HOST: ${{ vars.SPACEWEB_HOST }}
          SSH_USER: ${{ vars.SPACEWEB_USER }}
          SSH_PORT: ${{ vars.SPACEWEB_PORT || '22' }}
          SSHPASS: ${{ secrets.SPACEWEB_PASSWORD }}
          DB_PASS: ${{ secrets.SPACEWEB_DB_PASSWORD }}
          DB_HOST: ${{ vars.SPACEWEB_DB_HOST }}
          DB_PORT: ${{ vars.SPACEWEB_DB_PORT }}
          DB_NAME: ${{ vars.SPACEWEB_DB_NAME || 'kutygama_podokon' }}
          DB_USER: ${{ vars.SPACEWEB_DB_USER || 'kutygama_podokon' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Пароль базы в секретах: $([ -n "$DB_PASS" ] && echo есть || echo НЕТ)"
          echo "Заданный хост: ${DB_HOST:-не задан}, порт: ${DB_PORT:-не задан}, база: $DB_NAME, пользователь: $DB_USER"
          # Пароль базы уходит первой строкой stdin — не в командную строку и не в лог.
          { printf '%s\n' "$DB_PASS"; cat <<EOF
          DB_HOST='$DB_HOST'; DB_PORT='$DB_PORT'; DB_NAME='$DB_NAME'; DB_USER='$DB_USER'
          EOF
          cat <<'EOF'
          echo "== Порты, которые слушают на этой машине"
          for f in /proc/net/tcp /proc/net/tcp6; do awk 'NR>1 && $4=="0A" {split($2,a,":"); print strtonum("0x" a[2])}' $f 2>/dev/null; done | sort -nu | tr '\n' ' '; echo
          echo "== Имена серверов"
          for h in pgsql postgres postgresql pgsql.sweb.ru pg.sweb.ru; do getent hosts $h; done
          try() {
            out=$(psql "host=$1 port=$2 dbname=$DB_NAME user=$DB_USER connect_timeout=5 sslmode=prefer" -XAtc "select version(); show server_encoding; show lc_collate; select string_agg(name, ', ' order by name) from pg_available_extensions where name in ('pgcrypto','uuid-ossp','pg_trgm','citext','unaccent','plpgsql'); select current_user, has_database_privilege(current_database(),'CREATE');" 2>&1)
            echo "-- $1:$2"; echo "$out" | head -n 8
          }
          for h in ${DB_HOST:-} pg.sweb.ru localhost; do [ -n "$h" ] || continue; for p in ${DB_PORT:-} 5432 5433 6432; do try $h $p; done; done
          EOF
          } | sshpass -e ssh -p "$SSH_PORT" -o PubkeyAuthentication=no "$SSH_USER@$SSH_HOST" 'IFS= read -r PGPASSWORD; export PGPASSWORD; bash -s'
      - name: База Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Секрет SUPABASE_DB_URL: НЕТ"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -XAtc "select 'Supabase: подключение есть, ' || version()" 2>&1 | sed -E 's#postgres(ql)?://[^ ]*#<url>#g' | head -n 3
