name: hosting-probe

# Разовая проверка хостинга SpaceWeb перед переездом базы: версии языков и PostgreSQL,
# доступ к базе с хостинга, выход в интернет. Только читает, ничего не меняет.
on:
  push:
    branches: [claude/relaxed-euler-8qpsqr]
    paths: [".github/workflows/hosting-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: vars.SPACEWEB_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: База SpaceWeb
        env:
          SSH_HOST: ${{ vars.SPACEWEB_HOST }}
          SSH_USER: ${{ vars.SPACEWEB_USER }}
          SSH_PORT: ${{ vars.SPACEWEB_PORT || '22' }}
          SSHPASS: ${{ secrets.SPACEWEB_PASSWORD }}
          DB_PASS: ${{ secrets.SPACEWEB_DB_PASSWORD }}
          DB_HOST: ${{ vars.SPACEWEB_DB_HOST || 'pg4.sweb.ru' }}
          DB_PORT: ${{ vars.SPACEWEB_DB_PORT || '5433' }}
          DB_NAME: ${{ vars.SPACEWEB_DB_NAME || 'kutygama_podokon' }}
          DB_USER: ${{ vars.SPACEWEB_DB_USER || 'kutygama_podokon' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Пробелы и переводы строк по краям — частая ошибка при копировании с телефона.
          trimmed=$(printf '%s' "$DB_PASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\r\n')
          echo "Пароль базы в секретах: $([ -n "$DB_PASS" ] && echo есть || echo НЕТ), символов: ${#DB_PASS}, без пробелов по краям: ${#trimmed}"
          case "$trimmed" in *[!A-Za-z0-9]*) echo "В пароле есть символы кроме латинских букв и цифр" ;; esac
          DB_PASS=$trimmed
          echo "Заданный хост: ${DB_HOST:-не задан}, порт: ${DB_PORT:-не задан}, база: $DB_NAME, пользователь: $DB_USER"
          # Пароль базы уходит первой строкой stdin — не в командную строку и не в лог.
          { printf '%s\n' "$DB_PASS"; cat <<EOF
          DB_HOST='$DB_HOST'; DB_PORT='$DB_PORT'; DB_NAME='$DB_NAME'; DB_USER='$DB_USER'
          EOF
          cat <<'EOF'
          echo "== Порты, которые слушают на этой машине"
          for f in /proc/net/tcp /proc/net/tcp6; do awk 'NR>1 && $4=="0A" {split($2,a,":"); print strtonum("0x" a[2])}' $f 2>/dev/null; done | sort -nu | tr '\n' ' '; echo
          echo "== Имена серверов"
          for h in pgsql postgres postgresql pg.sweb.ru pg4.sweb.ru; do getent hosts $h; done
          q() { psql "host=$DB_HOST port=$DB_PORT dbname=$DB_NAME user=$DB_USER connect_timeout=5" -XAt -c "$1" 2>&1 | head -n 5; }
          echo "-- $DB_HOST:$DB_PORT"
          q "select version()"
          q "select 'кодировка ' || pg_encoding_to_char(encoding) || ', сортировка ' || datcollate from pg_database where datname = current_database()"
          q "select 'пользователь ' || current_user || ', суперпользователь: ' || usesuper || ', создавать схемы: ' || has_database_privilege(current_database(),'CREATE') from pg_user where usename = current_user"
          q "select 'расширения доступны: ' || string_agg(name || coalesce(' (' || installed_version || ')', ''), ', ' order by name) from pg_available_extensions where name in ('pgcrypto','uuid-ossp','pg_trgm','citext','unaccent','pg_cron','pg_net','http')"
          q "select 'схемы: ' || string_agg(nspname, ', ') from pg_namespace where nspname not like 'pg_%' and nspname <> 'information_schema'"
          q "select 'лимит подключений: ' || rolconnlimit from pg_roles where rolname = current_user"
          q "select 'createrole: ' || rolcreaterole || ', createdb: ' || rolcreatedb || ', bypassrls: ' || rolbypassrls from pg_roles where rolname = current_user"
          q "begin; create role podokonnik_probe_role nologin; select 'создать роль: можно'; rollback;"
          q "begin; create schema probe_tmp; create table probe_tmp.t (id int); alter table probe_tmp.t enable row level security; alter table probe_tmp.t force row level security; select 'force rls: можно'; rollback;"
          q "begin; create extension if not exists pgcrypto; select 'pgcrypto: можно'; rollback;"
          EOF
          } | sshpass -e ssh -p "$SSH_PORT" -o PubkeyAuthentication=no "$SSH_USER@$SSH_HOST" 'IFS= read -r PGPASSWORD; export PGPASSWORD; bash -s'
      - name: Прямое подключение и туннель
        env:
          SSH_HOST: ${{ vars.SPACEWEB_HOST }}
          SSH_USER: ${{ vars.SPACEWEB_USER }}
          SSH_PORT: ${{ vars.SPACEWEB_PORT || '22' }}
          SSHPASS: ${{ secrets.SPACEWEB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SPACEWEB_DB_PASSWORD }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          echo "-- напрямую из GitHub"
          timeout 15 psql "host=pg4.sweb.ru port=5433 dbname=kutygama_podokon user=kutygama_podokon connect_timeout=8" -XAtc "select 'напрямую: работает'" 2>&1 | head -n 2 || true
          echo "-- через SSH-туннель"
          sshpass -e ssh -p "$SSH_PORT" -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -f -N -L 15433:pg4.sweb.ru:5433 "$SSH_USER@$SSH_HOST" 2>&1 | head -n 3 || true
          sleep 3
          timeout 15 psql "host=127.0.0.1 port=15433 dbname=kutygama_podokon user=kutygama_podokon connect_timeout=8" -XAtc "select 'туннель: работает'" 2>&1 | head -n 2 || true
      - name: База Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Секрет SUPABASE_DB_URL: НЕТ"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          # Прямой адрес db.<ref>.supabase.co доступен только по IPv6, которого у GitHub нет:
          # такой URL переводим на пулер (IPv4) того же региона — пробуем оба варианта имени.
          urls=$(python3 - <<'PY'
          import os, urllib.parse as u
          url = os.environ["SUPABASE_DB_URL"].strip()
          p = u.urlsplit(url)
          host = p.hostname or ""
          if host.startswith("db.") and host.endswith(".supabase.co"):
              ref = host.split(".")[1]
              pw = p.password or ""
              for n in ("aws-0", "aws-1"):
                  print(f"postgresql://postgres.{ref}:{pw}@{n}-eu-central-1.pooler.supabase.com:5432/postgres")
          else:
              print(url)
          PY
          )
          for url in $urls; do
            out=$(psql "$url" -XAtc "select 'Supabase: подключение есть, ' || version(); select 'размер базы: ' || pg_size_pretty(pg_database_size(current_database())); select 'пользователей: ' || count(*) from auth.users; select 'файлов: ' || count(*) || ', ' || pg_size_pretty(coalesce(sum((metadata->>'size')::bigint),0)) from storage.objects" 2>&1) && { echo "$out"; exit 0; }
            echo "$out" | sed -E 's#postgres(ql)?://[^ ]*#<url>#g' | head -n 2
          done
