name: web-deploy

# Публикует сайт на GitHub Pages при изменениях в main.
# Нужно один раз: Settings → Pages → Source: GitHub Actions, и переменные репозитория
# (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY — publishable-ключ всё равно виден в браузере,
#   данные защищают RLS-политики. Без переменных сайт соберётся в демо-режиме.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # prebuild обновляет снимок базы знаний из Supabase, затем Next.js собирает статический сайт в out/.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
