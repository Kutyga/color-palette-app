# Шаблоны писем Supabase Auth из supabase/templates/ → настройки проекта через Management API.
# Нужен секрет SUPABASE_ACCESS_TOKEN (personal access token из supabase.com/dashboard/account/tokens).
name: supabase-email-templates

on:
  push:
    branches: [main]
    paths:
      - "supabase/templates/**"
      - ".github/workflows/supabase-email-templates.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: intskfwuljzaaghoaqfx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Записать шаблоны в Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          jq -n \
            --arg confirm_subject "Подтвердите почту — Подоконник" \
            --rawfile confirm_body supabase/templates/confirm-signup.html \
            --arg recovery_subject "Восстановление пароля — Подоконник" \
            --rawfile recovery_body supabase/templates/reset-password.html \
            '{mailer_subjects_confirmation: $confirm_subject, mailer_templates_confirmation_content: $confirm_body,
              mailer_subjects_recovery: $recovery_subject, mailer_templates_recovery_content: $recovery_body}' > body.json
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json)
          echo "HTTP $status"
          if [ "$status" -ge 300 ]; then
            cat response.json
            exit 1
          fi
          jq -r '.mailer_subjects_confirmation, .mailer_subjects_recovery' response.json
