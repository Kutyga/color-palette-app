name: db-spaceweb

# Перенос базы из Supabase в PostgreSQL на SpaceWeb (spaceweb/db/migrate.sh): схема, данные,
# пользователи с паролями, метаданные фото, секреты, расписание, правила доступа.
# Сайт при этом продолжает работать на Supabase — эта база ему пока не нужна.
#
# Нужно (Settings → Secrets and variables → Actions):
#   Secrets: SUPABASE_DB_URL — строка подключения к Supabase (Connect → Session pooler или прямая);
#            SPACEWEB_DB_PASSWORD — пароль базы SpaceWeb;
#            SUPABASE_SERVICE_KEY — служебный ключ Supabase (Project Settings → API Keys → secret),
#            нужен, чтобы скачать фото из хранилища Supabase. Без него фото не переносятся.
#   Variables (необязательно, по умолчанию — значения из панели SpaceWeb):
#            SPACEWEB_DB_HOST, SPACEWEB_DB_PORT, SPACEWEB_DB_NAME, SPACEWEB_DB_USER.
#
# Запуск: Actions → db-spaceweb → Run workflow. Галочка «reset» — очистить базу SpaceWeb и
# перенести заново. Когда сайт переключён на SpaceWeb (api.live), перенос откажется работать.
on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Очистить базу SpaceWeb и перенести заново"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-spaceweb
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pg_dump должен быть не старше сервера: у Supabase и SpaceWeb — PostgreSQL 17.
      - name: Клиент PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Перенос
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SPACEWEB_DB_PASSWORD }}
          DB_HOST: ${{ vars.SPACEWEB_DB_HOST || 'pg4.sweb.ru' }}
          DB_PORT: ${{ vars.SPACEWEB_DB_PORT || '5433' }}
          DB_NAME: ${{ vars.SPACEWEB_DB_NAME || 'kutygama_podokon' }}
          DB_USER: ${{ vars.SPACEWEB_DB_USER || 'kutygama_podokon' }}
          RESET_INPUT: ${{ inputs.reset }}
        run: |
          export PG_BIN=/usr/lib/postgresql/17/bin
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Нет секрета SUPABASE_DB_URL"; exit 1; }
          [ -n "$PGPASSWORD" ] || { echo "::error::Нет секрета SPACEWEB_DB_PASSWORD"; exit 1; }
          SRC_URL=$(bash spaceweb/db/find-source.sh)
          export SRC_URL
          export DST_URL="host=$DB_HOST port=$DB_PORT dbname=$DB_NAME user=$DB_USER connect_timeout=15"
          [ "$RESET_INPUT" = true ] && export RESET=yes
          bash spaceweb/db/migrate.sh
      # Фото: скачиваем из хранилища Supabase служебным ключом и кладём на хостинг рядом с сайтом
      # (podokonnik-storage, вне public_html). Уже загруженные на хостинге файлы не удаляются.
      - name: Фото
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SSH_HOST: ${{ vars.SPACEWEB_HOST }}
          SSH_USER: ${{ vars.SPACEWEB_USER }}
          SSH_PORT: ${{ vars.SPACEWEB_PORT || '22' }}
          SSHPASS: ${{ secrets.SPACEWEB_PASSWORD }}
          TARGET_DIR: ${{ vars.SPACEWEB_PATH }}
        run: |
          if [ -z "$SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Фото не перенесены: добавьте секрет SUPABASE_SERVICE_KEY (и переменную SUPABASE_URL)"
            exit 0
          fi
          export PG_BIN=/usr/lib/postgresql/17/bin
          sudo apt-get install -y -qq sshpass >/dev/null
          SRC_URL=$(bash spaceweb/db/find-source.sh) bash spaceweb/db/sync-photos.sh
