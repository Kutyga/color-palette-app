name: plant-app

on:
  push:
    paths: ["mobile/**", "supabase/**", "scripts/**", ".github/workflows/plant-app.yml"]
  pull_request:
    paths: ["mobile/**", "supabase/**", "scripts/**", ".github/workflows/plant-app.yml"]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + smoke test on local Postgres
        run: scripts/check-migrations.sh

  news-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --no-warnings --test supabase/functions/news-ingest/feed.test.ts supabase/functions/identify-plant/plantnet.test.ts
